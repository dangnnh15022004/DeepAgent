services:
  postgres:
    image: postgres:16-alpine
    container_name: deepagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Haidang123
      POSTGRES_DB: deepagent
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deepagent"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepagent_api
    restart: always
    env_file:
      - .env
    environment:
      # Inside the docker network, the postgres host is the service name.
      POSTGRES_DSN: postgresql://postgres:Haidang123@postgres:5432/deepagent
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
